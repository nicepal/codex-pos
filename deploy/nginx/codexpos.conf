# Poshive — matches the existing sites-available layout.
# App origin: 8502 (assigned range). 8088 kept only if an old panel still
# forwards there. API is PM2 on 127.0.0.1:8510 (not 5000).
# Public 80/443 should proxy to 127.0.0.1:8502 after TLS is fixed.

upstream poshive_api {
    server 127.0.0.1:8510;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8502;
    listen 8088;
    listen [::]:8502;
    server_name poshive.store www.poshive.store;

    root /srv/work/plain/codex-pos/main-website/dist;
    index index.html;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://poshive_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Domain $host;
        proxy_read_timeout 120s;
    }

    location /socket.io/ {
        proxy_pass http://poshive_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8502 default_server;
    listen 8088 default_server;
    listen [::]:8502 default_server;
    server_name app.poshive.store _;

    root /srv/work/plain/codex-pos/frontend/dist;
    index index.html;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://poshive_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Domain $host;
        proxy_read_timeout 120s;
    }

    location /socket.io/ {
        proxy_pass http://poshive_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Domain $host;
        proxy_read_timeout 86400s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
